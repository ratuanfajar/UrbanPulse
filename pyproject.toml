[project]
name = "hackathon-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arcgis2geojson>=3.1.1",
    "contextily>=1.7.0",
    "earthengine-api>=1.7.30",
    "fastapi>=0.137.1",
    "geemap>=0.37.2",
    "geopandas>=1.1.3",
    "ipykernel>=7.2.0",
    "joblib>=1.5.3",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "openai>=2.41.1",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyproj>=3.7.2",
    "python-dotenv>=1.2.2",
    "rasterio>=1.4.4",
    "requests>=2.34.2",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
    "shapely>=2.1.2",
    "torch>=2.6,<2.7",
    "torchvision==0.21.0",
    "tqdm>=4.68.1",
    "uvicorn[standard]>=0.49.0",
    "xgboost>=3.2.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
